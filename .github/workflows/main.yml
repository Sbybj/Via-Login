name: Build Via Login APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Via_7.3.4.apk'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool
          apktool --version

      - name: Prepare original dex
        run: unzip -p Via_7.3.4.apk classes.dex > original.dex

      - name: Decode APK
        run: apktool d Via_7.3.4.apk -o decoded -f

      - name: Patch Shell launcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("decoded/smali/mark/via/Shell.smali")
          s = p.read_text()
          marker = ".method"
          pos = s.find(" onCreate(Landroid/os/Bundle;)V")
          if pos < 0:
              raise SystemExit("Shell.onCreate not found")
          method_start = s.rfind(".method", 0, pos)
          locals_pos = s.find(".locals", method_start, s.find(".end method", method_start))
          if locals_pos < 0:
              raise SystemExit("Shell.onCreate locals not found")
          line_end = s.find("\n", locals_pos)
          inject = "\n    invoke-static {p0}, Lmark/via/LoginGate;->show(Landroid/app/Activity;)V"
          s = s[:line_end+1] + inject + s[line_end+1:]
          p.write_text(s)
          PY
          grep -n "LoginGate;->show" decoded/smali/mark/via/Shell.smali

      - name: Create login gate
        run: |
          mkdir -p buildsrc/mark/via
          cat > buildsrc/mark/via/LoginGate.java <<'JAVA'
          package mark.via;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.hardware.biometrics.BiometricPrompt;
          import android.os.Build;
          import android.security.keystore.KeyGenParameterSpec;
          import android.security.keystore.KeyProperties;
          import android.content.SharedPreferences;
          import android.graphics.Typeface;
          import android.text.InputType;
          import android.view.Gravity;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Button;
          import android.widget.Toast;
          import java.security.KeyStore;
          import java.util.concurrent.Executor;
          import java.util.concurrent.Executors;
          import javax.crypto.Cipher;
          import javax.crypto.KeyGenerator;
          import javax.crypto.SecretKey;

          public final class LoginGate {
              private static final String PREF = "via_gate";
              private static final String BIO = "biometric_enabled";
              private static final String KEY = "ViaBiometricKey";
              private static final Executor EXECUTOR = Executors.newSingleThreadExecutor();

              // Called from Shell.onCreate: every fresh process/activity launch must verify.
              // No "logged in" preference is stored; only biometric enrollment is persistent.
              public static void show(final Activity a) {
                  final SharedPreferences sp = a.getSharedPreferences(PREF, 0);
                  if (Build.VERSION.SDK_INT >= 28 && sp.getBoolean(BIO, false)) {
                      if (authenticate(a, sp)) return;
                      sp.edit().putBoolean(BIO, false).apply();
                  }
                  showPassword(a, sp);
              }

              private static void showPassword(final Activity a, final SharedPreferences sp) {
                  LinearLayout box = new LinearLayout(a);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(48, 24, 48, 8);

                  TextView title = new TextView(a);
                  title.setText("Via");
                  title.setTextSize(28);
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);
                  box.addView(title, new LinearLayout.LayoutParams(-1, -2));

                  EditText user = new EditText(a);
                  user.setHint("账号");
                  user.setSingleLine(true);
                  box.addView(user, new LinearLayout.LayoutParams(-1, -2));

                  EditText pass = new EditText(a);
                  pass.setHint("密码");
                  pass.setSingleLine(true);
                  pass.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_PASSWORD);
                  box.addView(pass, new LinearLayout.LayoutParams(-1, -2));

                  Button login = new Button(a);
                  login.setText("登录");
                  box.addView(login, new LinearLayout.LayoutParams(-1, -2));

                  final AlertDialog d = new AlertDialog.Builder(a)
                      .setView(box)
                      .setCancelable(false)
                      .create();

                  login.setOnClickListener(v -> {
                      if ("123".equals(user.getText().toString()) &&
                          "135359".equals(pass.getText().toString())) {
                          d.dismiss();
                          if (Build.VERSION.SDK_INT >= 28 && !sp.getBoolean(BIO, false)) {
                              offerBiometric(a, sp);
                          }
                      } else {
                          Toast.makeText(a, "账号或密码错误", Toast.LENGTH_SHORT).show();
                      }
                  });
                  d.setOnShowListener(v -> {
                      d.getWindow().setSoftInputMode(android.view.WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);
                  });
                  d.show();
              }

              private static Cipher makeCipher() throws Exception {
                  KeyStore ks = KeyStore.getInstance("AndroidKeyStore");
                  ks.load(null);
                  if (!ks.containsAlias(KEY)) {
                      KeyGenerator kg = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore");
                      KeyGenParameterSpec spec = new KeyGenParameterSpec.Builder(
                          KEY, KeyProperties.PURPOSE_ENCRYPT | KeyProperties.PURPOSE_DECRYPT)
                          .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                          .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                          .setUserAuthenticationRequired(true)
                          .setInvalidatedByBiometricEnrollment(true)
                          .build();
                      kg.init(spec);
                      kg.generateKey();
                  }
                  SecretKey key = (SecretKey) ks.getKey(KEY, null);
                  Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding");
                  cipher.init(Cipher.ENCRYPT_MODE, key);
                  return cipher;
              }

              private static boolean authenticate(final Activity a, final SharedPreferences sp) {
                  try {
                      Cipher cipher = makeCipher();
                      BiometricPrompt prompt = new BiometricPrompt(a, EXECUTOR,
                          new BiometricPrompt.AuthenticationCallback() {
                              @Override public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult result) {
                              }
                              @Override public void onAuthenticationError(int code, CharSequence msg) {
                                  a.runOnUiThread(() -> showPassword(a, sp));
                              }
                              @Override public void onAuthenticationFailed() {
                              }
                          });
                      BiometricPrompt.PromptInfo info = new BiometricPrompt.PromptInfo.Builder()
                          .setTitle("Via 指纹登录")
                          .setSubtitle("请使用指纹验证")
                          .setNegativeButtonText("使用密码")
                          .build();
                      prompt.authenticate(info, new BiometricPrompt.CryptoObject(cipher));
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              private static void offerBiometric(final Activity a, final SharedPreferences sp) {
                  try {
                      Cipher cipher = makeCipher();
                      BiometricPrompt prompt = new BiometricPrompt(a, EXECUTOR,
                          new BiometricPrompt.AuthenticationCallback() {
                              @Override public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult result) {
                                  sp.edit().putBoolean(BIO, true).apply();
                                  a.runOnUiThread(() -> Toast.makeText(a, "指纹登录已开启", Toast.LENGTH_SHORT).show());
                              }
                          });
                      BiometricPrompt.PromptInfo info = new BiometricPrompt.PromptInfo.Builder()
                          .setTitle("开启指纹登录")
                          .setSubtitle("下次打开 Via 可使用指纹")
                          .setNegativeButtonText("以后再说")
                          .build();
                      prompt.authenticate(info, new BiometricPrompt.CryptoObject(cipher));
                  } catch (Exception ignored) {
                  }
              }
          }
          JAVA

      - name: Compile and merge DEX
        run: |
          SDK="$ANDROID_HOME"
          PLATFORM=$(ls -d "$SDK"/platforms/android-* | sort -V | tail -1)
          BUILD_TOOLS=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          curl -L --fail -o smali.jar https://repo1.maven.org/maven2/org/smali/smali/2.5.2/smali-2.5.2.jar
          curl -L --fail -o dexlib2.jar https://repo1.maven.org/maven2/org/smali/dexlib2/2.5.2/dexlib2-2.5.2.jar
          curl -L --fail -o util.jar https://repo1.maven.org/maven2/org/smali/util/2.5.2/util-2.5.2.jar
          curl -L --fail -o jcommander.jar https://repo1.maven.org/maven2/com/beust/jcommander/1.64/jcommander-1.64.jar
          curl -L --fail -o antlr.jar https://repo1.maven.org/maven2/org/antlr/antlr/3.5.2/antlr-3.5.2.jar
          curl -L --fail -o antlr-runtime.jar https://repo1.maven.org/maven2/org/antlr/antlr-runtime/3.5.2/antlr-runtime-3.5.2.jar
          curl -L --fail -o stringtemplate.jar https://repo1.maven.org/maven2/org/antlr/stringtemplate/3.2.1/stringtemplate-3.2.1.jar
          curl -L --fail -o guava.jar https://repo1.maven.org/maven2/com/google/guava/guava/27.1-android/guava-27.1-android.jar
          curl -L --fail -o jsr305.jar https://repo1.maven.org/maven2/com/google/code/findbugs/jsr305/3.0.2/jsr305-3.0.2.jar
          mkdir -p buildsrc/classes buildsrc/dex
          javac -source 8 -target 8 -classpath "$PLATFORM/android.jar" -d buildsrc/classes buildsrc/mark/via/LoginGate.java
          jar cf buildsrc/login.jar -C buildsrc/classes .
          java -cp "smali.jar:dexlib2.jar:util.jar:jcommander.jar:antlr.jar:antlr-runtime.jar:stringtemplate.jar:guava.jar:jsr305.jar" org.jf.smali.Main assemble decoded/smali -o patched-original.dex
          "$BUILD_TOOLS/d8" --release --lib "$PLATFORM/android.jar" patched-original.dex buildsrc/login.jar --output buildsrc/dex
          cp buildsrc/dex/classes.dex merged.dex
          ls -lh merged.dex

      - name: Build patched APK without resource rebuild
        run: |
          python3 - <<'PY'
          import zipfile
          src='Via_7.3.4.apk'
          dst='patched.apk'
          with zipfile.ZipFile(src,'r') as zin, zipfile.ZipFile(dst,'w') as zout:
              for item in zin.infolist():
                  if item.filename == 'classes.dex':
                      continue
                  zout.writestr(item, zin.read(item.filename))
              zout.write('merged.dex','classes.dex')
          PY

      - name: Sign APK
        run: |
          SDK="$ANDROID_HOME"
          BUILD_TOOLS=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -v -keystore release.jks -alias via -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Via" >/dev/null 2>&1
          mkdir -p out
          "$BUILD_TOOLS/zipalign" -f 4 patched.apk out/Via-Login-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks release.jks --ks-pass pass:android --key-pass pass:android --out out/Via-Login.apk out/Via-Login-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose out/Via-Login.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Via-Login-APK
          path: out/Via-Login.apk
