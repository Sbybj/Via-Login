name: Inspect Via APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Via_7.3.4.apk'
      - '.github/workflows/main.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool
          apktool --version

      - name: Decode APK
        run: |
          apktool d Via_7.3.4.apk -o decoded -f

      - name: Show manifest and launcher
        run: |
          echo "===== MANIFEST ====="
          sed -n '1,240p' decoded/AndroidManifest.xml
          echo "===== ACTIVITY/LAUNCHER SEARCH ====="
          grep -Rni -E 'MAIN|LAUNCHER' decoded/AndroidManifest.xml || true
          echo "===== SMALI DIRECTORIES ====="
          find decoded -maxdepth 2 -type d -name 'smali*' -print
          echo "===== PACKAGE HINTS ====="
          grep -Rni 'mark.via' decoded/smali* | head -30 || true
